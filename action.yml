name: 'Agent Immune — Coding Agent Memory & CI Guard'
description: 'Audit coding agent rules (CLAUDE.md, .cursorrules, AGENTS.md, .immune/rules.jsonl) for leaked paths/secrets and generate Pitfall Immunity Scorecards.'
author: 'meat-daemon-404'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  mode:
    description: 'Execution mode: "ci-check" (audit agent rules & team memory), "team-sync-check" (validate .immune/rules.jsonl), or "wrapped" (generate SVG/Markdown scorecard).'
    required: false
    default: 'ci-check'
  strict:
    description: 'Fail the workflow step when ci-check or team-sync --check detects violations ("true" or "false").'
    required: false
    default: 'true'
  wrapped-output:
    description: 'Output file path when mode is "wrapped" (default: "immune-wrapped.svg").'
    required: false
    default: 'immune-wrapped.svg'

outputs:
  status:
    description: 'Result status ("ok" or "failed").'
    value: ${{ steps.run_immune.outputs.status }}

runs:
  using: 'composite'
  steps:
    - name: Run Agent Immune Gate
      id: run_immune
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_WRAPPED_OUT: ${{ inputs.wrapped-output }}
      run: |
        set -euo pipefail
        if [ "$INPUT_MODE" = "team-sync-check" ]; then
          npx --yes dsh-immune-system team-sync --check
        elif [ "$INPUT_MODE" = "wrapped" ]; then
          npx --yes dsh-immune-system wrapped "$INPUT_WRAPPED_OUT"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            npx --yes dsh-immune-system wrapped --markdown >> "$GITHUB_STEP_SUMMARY" || true
          fi
        else
          if [ "$INPUT_STRICT" = "true" ]; then
            npx --yes dsh-immune-system ci-check
          else
            npx --yes dsh-immune-system ci-check || true
          fi
          if [ -f ".immune/rules.jsonl" ]; then
            npx --yes dsh-immune-system team-sync --check
          fi
        fi
        echo "status=ok" >> "${GITHUB_OUTPUT:-/dev/null}"
