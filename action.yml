name: 'Agent Immune — Coding Agent Memory & CI Guard'
description: 'Zero-dependency PR pitfall gate: scan git diffs against AGENTS.md/CLAUDE.md antibodies, validate .immune/rules.jsonl & vaccine.lock.json, and publish Immunity Scorecards.'
author: 'meat-daemon-404'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  mode:
    description: 'Execution mode: "ci-check" (PR diff pitfall scan + optional team-sync/vaccine check), "team-sync-check" (validate .immune/rules.jsonl), "vaccinate-check" (verify .immune/vaccine.lock.json), or "wrapped" (generate SVG/Markdown scorecard).'
    required: false
    default: 'ci-check'
  strict:
    description: 'Fail the workflow step when findings or validation errors occur ("true" or "false").'
    required: false
    default: 'true'
  fail-on-findings:
    description: 'Alias for strict ("false" emits GitHub annotations and step summary without failing the job).'
    required: false
    default: ''
  doc:
    description: 'Path to AGENTS.md or CLAUDE.md containing the <!-- immune:generated --> block (auto-detected if omitted).'
    required: false
    default: ''
  base-ref:
    description: 'Base git ref to diff against in ci-check mode (defaults to PR base SHA or HEAD~1).'
    required: false
    default: ''
  node-version:
    description: 'Node.js version (requires ^22.19.0 || >=24.0.0 for built-in node:sqlite).'
    required: false
    default: '24'
  wrapped-output:
    description: 'Output file path when mode is "wrapped" (default: "immune-wrapped.svg").'
    required: false
    default: 'immune-wrapped.svg'

outputs:
  status:
    description: 'Result status ("ok" or "failed").'
    value: ${{ steps.run_immune.outputs.status }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Run Agent Immune Gate
      id: run_immune
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        INPUT_DOC: ${{ inputs.doc }}
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        INPUT_WRAPPED_OUT: ${{ inputs.wrapped-output }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_BASE_REF: ${{ github.base_ref }}
        ACTION_CLI: ${{ github.action_path }}/dsh-immune-system/dist/zcode/src/cli.js
      run: |
        set -euo pipefail

        run_cli() {
          if [ -f "$ACTION_CLI" ]; then
            node "$ACTION_CLI" "$@"
          else
            npx --yes dsh-immune-system "$@"
          fi
        }

        FAIL_ON_FINDINGS="$INPUT_STRICT"
        if [ -n "$INPUT_FAIL_ON_FINDINGS" ]; then
          FAIL_ON_FINDINGS="$INPUT_FAIL_ON_FINDINGS"
        fi

        if [ "$INPUT_MODE" = "team-sync-check" ]; then
          if [ "$FAIL_ON_FINDINGS" = "false" ]; then
            run_cli team-sync --check || true
          else
            run_cli team-sync --check
          fi
        elif [ "$INPUT_MODE" = "vaccinate-check" ]; then
          if [ "$FAIL_ON_FINDINGS" = "false" ]; then
            run_cli vaccinate --check || true
          else
            run_cli vaccinate --check
          fi
        elif [ "$INPUT_MODE" = "wrapped" ]; then
          run_cli wrapped "$INPUT_WRAPPED_OUT"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            run_cli wrapped --markdown >> "$GITHUB_STEP_SUMMARY" || true
          fi
        else
          BASE="${INPUT_BASE_REF:-${PR_BASE_SHA:-HEAD~1}}"
          DIFF_FILE="$(mktemp)"
          trap 'rm -f "$DIFF_FILE"' EXIT
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE" >/dev/null 2>&1 || \
              { [ -n "${PR_BASE_REF:-}" ] && git fetch --no-tags --depth=1 origin "$PR_BASE_REF" >/dev/null 2>&1 && BASE="FETCH_HEAD"; } || true
          fi
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            git diff "$BASE"...HEAD > "$DIFF_FILE" 2>/dev/null || git diff "$BASE" HEAD > "$DIFF_FILE" 2>/dev/null || true
          else
            git diff HEAD~1 HEAD > "$DIFF_FILE" 2>/dev/null || git diff HEAD > "$DIFF_FILE" 2>/dev/null || true
          fi

          EXTRA_ARGS=("--diff" "$DIFF_FILE" "--github")
          if [ -n "$INPUT_DOC" ]; then
            EXTRA_ARGS+=("--doc" "$INPUT_DOC")
          fi
          if [ "$FAIL_ON_FINDINGS" = "false" ]; then
            EXTRA_ARGS+=("--warn-only")
          fi
          run_cli ci-check "${EXTRA_ARGS[@]}"

          if [ -f ".immune/rules.jsonl" ]; then
            if [ "$FAIL_ON_FINDINGS" = "false" ]; then
              run_cli team-sync --check || true
            else
              run_cli team-sync --check
            fi
          fi
          if [ -f ".immune/vaccine.lock.json" ]; then
            if [ "$FAIL_ON_FINDINGS" = "false" ]; then
              run_cli vaccinate --check || true
            else
              run_cli vaccinate --check
            fi
          fi
        fi

        echo "status=ok" >> "${GITHUB_OUTPUT:-/dev/null}"
