name: Feature / Seed Pack / Host Adapter Request
description: Propose a new coding agent integration, starter seed pack, or engine enhancement
labels: [enhancement]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Proposal category
      options:
        - New coding agent host (connect / hooks / MCP)
        - New or expanded starter seed pack
        - Retrieval / rubric / triage improvement
        - CLI / Dashboard / GitHub Action UX
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or recurring pitfall
      description: "What concrete failure -> repair pattern or developer workflow does this address?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed design
      description: "Keep AGENTS.md invariants in mind (zero runtime dependencies, node:sqlite built-in only, strict hook schemas)."
    validations:
      required: true
