name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'dsh-immune-system/package.json'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: NPM
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Check if version is already published
        id: check
        run: |
          LOCAL_VER=$(node -p "require('./package.json').version")
          REMOTE_VER=$(npm view dsh-immune-system version 2>/dev/null || echo "0.0.0")
          echo "Local: $LOCAL_VER, npm: $REMOTE_VER"
          if [ "$LOCAL_VER" != "$REMOTE_VER" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install, build, test, and publish
        if: steps.check.outputs.should_publish == 'true'
        run: |
          npm ci
          npm run build
          npm test
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
