<svg xmlns="http://www.w3.org/2000/svg" width="880" height="366" viewBox="0 0 880 366" font-family="Consolas,Menlo,Monaco,monospace">
  <style>
    .s1 { animation: reveal 10s ease-out infinite; }
    .s2 { animation: reveal2 10s ease-out infinite; }
    .s3 { animation: reveal3 10s ease-out infinite; }
    @keyframes reveal {
      0%, 4% { opacity: 0.25; }
      10%, 100% { opacity: 1; }
    }
    @keyframes reveal2 {
      0%, 24% { opacity: 0.15; }
      32%, 100% { opacity: 1; }
    }
    @keyframes reveal3 {
      0%, 52% { opacity: 0.15; }
      62%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .s1, .s2, .s3 { animation: none; opacity: 1; }
    }
  </style>

  <!-- Window frame -->
  <rect width="880" height="366" rx="12" fill="#0b0f17"/>
  <rect x="1" y="1" width="878" height="364" rx="11" fill="none" stroke="#1e293b"/>
  <path d="M1 12 C1 6 6 1 12 1 H868 C874 1 879 6 879 12 V36 H1 Z" fill="#131b29"/>
  <line x1="1" y1="36" x2="879" y2="36" stroke="#1e293b"/>

  <!-- Traffic lights (fixed cx!) -->
  <circle cx="20" cy="18.5" r="5.8" fill="#ef4444"/>
  <circle cx="39" cy="18.5" r="5.8" fill="#f59e0b"/>
  <circle cx="58" cy="18.5" r="5.8" fill="#10b981"/>
  <text x="440" y="23" text-anchor="middle" fill="#94a3b8" font-size="12">agent-immune v2.1 — Claude Code · Cursor · Codex · Antigravity · Gemini CLI · ZCode · DSH</text>

  <!-- Step 1 -->
  <g class="s1">
    <rect x="20" y="50" width="92" height="20" rx="4" fill="#3f171d" stroke="#7f1d1d"/>
    <text x="66" y="64" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="700">1 · FAILURE</text>
    <text x="124" y="64" fill="#cbd5e1" font-size="12.5">$ npm install</text>
    <text x="20" y="85" fill="#f87171" font-size="12">npm ERR! ERESOLVE unable to resolve dependency tree: peer react@"^18.0.0" from ui-kit@2.4.0  [exit code: 1]</text>
  </g>

  <!-- Step 2 -->
  <g class="s2">
    <rect x="20" y="106" width="164" height="20" rx="4" fill="#0b2e23" stroke="#065f46"/>
    <text x="102" y="120" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700">2 · REPAIR &amp; RUBRIC GATE</text>
    <text x="196" y="120" fill="#e2e8f0" font-size="12.5">Fix succeeds → turn-end distils, scrubs paths &amp; scores before SQLite+FTS5 commit</text>
    <rect x="20" y="134" width="840" height="62" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="32" y="154" fill="#94a3b8" font-size="12">antibody #18  <tspan fill="#34d399">[advice · rubric 94/100]</tspan>  <tspan fill="#60a5fa">[scope: *]</tspan>  <tspan fill="#64748b">sha256-receipt: 9c41f08a…</tspan></text>
    <text x="32" y="173" fill="#94a3b8" font-size="12">trigger: <tspan fill="#60a5fa">Bash npm ERESOLVE peer dependency</tspan>   →   do: <tspan fill="#34d399">Align peer versions in package.json or pass --legacy-peer-deps</tspan></text>
  </g>

  <!-- Step 3 -->
  <g class="s3">
    <rect x="20" y="214" width="184" height="20" rx="4" fill="#172554" stroke="#1d4ed8"/>
    <text x="112" y="228" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="700">3 · PRE-TOOL INTERCEPTION</text>
    <text x="216" y="228" fill="#e2e8f0" font-size="12.5">Next week, another session hits the same territory — injected BEFORE repeat:</text>
    <rect x="20" y="242" width="840" height="72" rx="6" fill="#111827" stroke="#334155"/>
    <text x="32" y="262" fill="#64748b" font-size="12">&lt;immune_memory&gt;</text>
    <text x="32" y="281" fill="#fbbf24" font-size="12">1. [Bash npm ERESOLVE peer dependency] avoid: Blindly retrying npm install on ERESOLVE</text>
    <text x="32" y="299" fill="#34d399" font-size="12">   -&gt; do: Align peer versions in package.json or pass --legacy-peer-deps explicitly</text>
  </g>

  <!-- Footer command bar -->
  <line x1="20" y1="330" x2="860" y2="330" stroke="#1e293b"/>
  <text x="20" y="351" fill="#34d399" font-size="12.5">$ npx dsh-immune-system@latest connect</text>
  <text x="315" y="351" fill="#64748b" font-size="12">·</text>
  <text x="330" y="351" fill="#60a5fa" font-size="12.5">$ npx dsh-immune-system@latest demo</text>
  <text x="598" y="351" fill="#64748b" font-size="11.5">(30s in-memory · zero runtime deps)</text>
</svg>
